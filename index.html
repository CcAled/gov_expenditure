<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>地址校验工具（高德API）</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
    min-height: 100vh; display: flex; justify-content: center; align-items: flex-start;
    padding: 40px 16px; color: #e8eef2;
  }
  .card {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 16px; padding: 32px; width: 100%; max-width: 760px;
    backdrop-filter: blur(8px); box-shadow: 0 12px 40px rgba(0,0,0,0.35);
  }
  h1 { font-size: 22px; margin-bottom: 6px; }
  .sub { font-size: 13px; color: #9fb3c0; margin-bottom: 20px; }
  .key-row { display: flex; gap: 10px; margin-bottom: 8px; }
  .key-row input {
    flex: 1; padding: 10px 14px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2);
    background: rgba(0,0,0,0.3); color: #fff; font-size: 13px; outline: none;
  }
  .key-row button {
    padding: 10px 16px; border: none; border-radius: 8px; cursor: pointer;
    background: #455a64; color: #fff; font-size: 13px; white-space: nowrap;
  }
  .key-row button:hover { background: #546e7a; }
  .key-hint { font-size: 12px; color: #78909c; margin-bottom: 20px; line-height: 1.7; }
  .key-hint a { color: #4fc3f7; }
  .input-row { display: flex; gap: 10px; }
  input[type=text] {
    flex: 1; padding: 14px 16px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.2);
    background: rgba(0,0,0,0.3); color: #fff; font-size: 15px; outline: none;
  }
  input[type=text]:focus { border-color: #4fc3f7; }
  .btn { padding: 14px 30px; border: none; border-radius: 10px; cursor: pointer; font-size: 15px; font-weight: 600; transition: background .2s; }
  .btn-amap { background: #2e7d32; color: #fff; }
  .btn-amap:hover { background: #388e3c; }
  .examples { margin: 14px 0 0; font-size: 12px; color: #90a4ae; }
  .examples span { cursor: pointer; text-decoration: underline dotted; margin-right: 12px; }
  .examples span:hover { color: #4fc3f7; }
  #result { margin-top: 26px; display: none; }
  .badge {
    display: inline-block; padding: 6px 18px; border-radius: 999px;
    font-weight: 700; font-size: 14px; margin-bottom: 14px; letter-spacing: 1px;
  }
  .badge.pass { background: rgba(46,125,50,.25); color: #69f0ae; border: 1px solid #2e7d32; }
  .badge.suspect { background: rgba(245,124,0,.22); color: #ffb74d; border: 1px solid #ef6c00; }
  .badge.error { background: rgba(198,40,40,.25); color: #ef9a9a; border: 1px solid #c62828; }
  .detail { font-size: 14px; line-height: 2.0; background: rgba(0,0,0,0.25); border-radius: 10px; padding: 16px 18px; }
  .detail .kv b { color: #81d4fa; display: inline-block; width: 100px; font-weight: 600; }
  .note { margin-top: 12px; font-size: 13px; border-radius: 8px; padding: 10px 14px; line-height: 1.8; }
  .note.ok { background: rgba(46,125,50,.15); color: #a5d6a7; }
  .note.warn { background: rgba(245,124,0,.15); color: #ffb74d; }
  .note.err { background: rgba(198,40,40,.15); color: #ef9a9a; }
  .spin { display:inline-block; width:14px; height:14px; border:2px solid rgba(255,255,255,.3); border-top-color:#4fc3f7; border-radius:50%; animation:spin 0.8s linear infinite; vertical-align:-2px; margin-right:6px; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="card">
  <h1>📍 地址校验工具（高德地理编码 API）</h1>
  <div class="sub">将地址发给高德解析，依据匹配级别与格式化结果判断是否错误地址</div>

  <div class="key-row">
    <input type="text" id="amapKey" placeholder="高德 Web服务 Key（仅保存在本机浏览器）" />
    <button onclick="saveKey()">保存Key</button>
    <button onclick="testKey()">测试Key</button>
  </div>
  <div class="key-hint">
    ① 到 <a href="https://lbs.amap.com/" target="_blank">高德开放平台</a> → 应用管理 → 创建应用 → 添加「<b>Web服务</b>」类型 Key（不是 Web端(JS API)，选错会报错）；② 额度：个人开发者 5000 次/日；③ 若用 file:// 直接打开本文件，部分浏览器会拦截跨域请求，建议用本地服务器打开（如 <code>python -m http.server</code>）。
  </div>

  <div class="input-row">
    <input type="text" id="addr" placeholder="请输入完整地址，例如：海南省三亚市吉阳区迎宾路1号" onkeydown="if(event.key==='Enter')checkAmap()" />
    <button class="btn btn-amap" id="mainBtn" onclick="checkAmap()">高德校验</button>
  </div>
  <div class="examples">
    试试：
    <span onclick="fill('海南省三亚市吉阳区迎宾路1号')">三亚·正常地址</span>
    <span onclick="fill('海南省三亚市龙华区xx街道xx')">三亚·龙华区（错误）</span>
    <span onclick="fill('海南省三亚市吉阳区不存在的路123号')">三亚·不存在的路</span>
    <span onclick="fill('海南省三亚市xx街道xx')">三亚·缺区缺路</span>
  </div>

  <div id="result"></div>
</div>

<script>
document.getElementById('amapKey').value = localStorage.getItem('amap_key') || '';
function saveKey(){
  localStorage.setItem('amap_key', document.getElementById('amapKey').value.trim());
  setResult('<div class="note ok">✔ Key 已保存到本机浏览器</div>');
}
function fill(t){ document.getElementById('addr').value = t; checkAmap(); }

// ---------- 请求封装：优先 fetch(CORS)，失败自动降级 JSONP ----------
function amapRequest(params) {
  const key = (localStorage.getItem('amap_key') || '').trim();
  const qs = Object.entries({...params, key, output: 'json'})
    .map(([k,v]) => k + '=' + encodeURIComponent(v)).join('&');

  // 方式1：fetch（高德 Web服务 API 已支持 CORS）
  return fetch('https://restapi.amap.com/v3/geocode/geo?' + qs, {mode: 'cors'})
    .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .catch(() => jsonpRequest(params, key)); // 降级 JSONP
}

function jsonpRequest(params, key) {
  return new Promise((resolve, reject) => {
    const cb = '_amap_cb_' + Math.random().toString(36).slice(2);
    const s = document.createElement('script');
    const timer = setTimeout(() => { cleanup(); reject(new Error('请求超时：JSONP 无响应（可能是跨域被拦截，请用本地服务器方式打开本页面）')); }, 10000);
    function cleanup(){ clearTimeout(timer); try { delete window[cb]; } catch(e){ window[cb] = undefined; } s.remove(); }
    window[cb] = (data) => { cleanup(); resolve(data); };
    s.onerror = () => { cleanup(); reject(new Error('网络错误：无法连接高德服务器')); };
    const qs = Object.entries({...params, key, output: 'json', callback: cb})
      .map(([k,v]) => k + '=' + encodeURIComponent(v)).join('&');
    s.src = 'https://restapi.amap.com/v3/geocode/geo?' + qs;
    document.body.appendChild(s);
  });
}

function getKey() {
  const k = (document.getElementById('amapKey').value || '').trim();
  if (k) localStorage.setItem('amap_key', k);
  return k;
}

function setResult(html) {
  const box = document.getElementById('result');
  box.style.display = 'block';
  box.innerHTML = html;
}

function badge(level, text) {
  const m = {pass: 'pass', suspect: 'suspect', error: 'error'};
  return `<div class="badge ${m[level]}">${text}</div>`;
}

// ---------- 测试 Key 连通性 ----------
async function testKey() {
  const k = getKey();
  if (!k) { setResult('<div class="note err">请先填写 Key</div>'); return; }
  setResult('<div class="note"><span class="spin"></span>正在测试 Key…</div>');
  try {
    const data = await amapRequest({address: '北京市东城区'});
    if (data.status === '1') {
      setResult('<div class="note ok">✔ Key 有效，API 连通正常，可以开始校验地址</div>');
    } else {
      const msg = { '10001': 'Key不正确或过期', '10003': '访问已超出日访问量', '10004': '单位时间内访问过于频繁',
        '10009': '请求Key与绑定平台不符（应选Web服务类型）', '10044': '余额不足' }[data.infocode];
      setResult(`<div class="note err">✘ Key 测试失败<br>infocode: ${data.infocode}，info: ${data.info}${msg ? '<br>提示：' + msg : ''}</div>`);
    }
  } catch (e) {
    setResult(`<div class="note err">✘ 请求失败：${e.message}</div>`);
  }
}

// ---------- 主校验 ----------
async function checkAmap() {
  const btn = document.getElementById('mainBtn');
  const addr = document.getElementById('addr').value.trim();
  if (!addr) { setResult('<div class="note err">请先输入地址</div>'); return; }
  if (!getKey()) { setResult('<div class="note err">请先填写并保存高德 Web服务 Key</div>'); return; }

  btn.disabled = true; btn.textContent = '校验中…';
  setResult('<div class="detail"><span class="spin"></span>正在调用高德地理编码 API…</div>');
  try {
    const data = await amapRequest({address: addr});
    if (data.status !== '1') {
      const msg = { '10001': 'Key不正确', '10003': '超出日访问配额', '10009': 'Key类型错误（应为Web服务）', '10044': '余额不足' }[data.infocode];
      setResult(badge('suspect','SUSPECT · API调用失败') +
        `<div class="detail">infocode: ${data.infocode}，info: ${data.info}${msg ? '<br>提示：' + msg : ''}</div>`);
      return;
    }

    const count = parseInt(data.count || '0', 10);
    if (count === 0) {
      setResult(badge('error','ERROR · 高德无此地址') +
        `<div class="detail">高德地理编码返回 <b>0</b> 条结果。<br>
        对于结构完整的真实地址（省-市-区-路-门牌），高德通常至少能匹配到路段级。
        <div class="note err">结论：该地址很可能是<b>错误或编造</b>的，请核对路名、门牌、区名是否存在。</div></div>`);
      return;
    }

    const g = data.geocodes[0];
    const level = g.level || '';
    // 常见 level：国家/省/市/区县/乡镇/村庄/道路/门牌号/兴趣点
    const precise = ['门牌号','门址','单元门','兴趣点','楼栋','小区','村庄'].includes(level);
    const rough = ['国家','省','市','区县','乡镇'].includes(level);

    // 从原地址提取的省市区，与高德返回比对
    const mismatches = [];
    // 先剥掉省、市前缀，再提取区/县，避免把"海南省三亚市"整体误当区名
    let rest = addr;
    if (g.province && rest.startsWith(g.province)) rest = rest.slice(g.province.length);
    if (g.city && rest.startsWith(g.city)) rest = rest.slice(g.city.length);
    const dm = rest.match(/([\u4e00-\u9fa5]{1,6}?(?:区|县|旗))/);
    const localDistrict = dm ? dm[1] : '';
    if (localDistrict && g.district && localDistrict !== g.district)
      mismatches.push(`区县不一致：地址中写「${localDistrict}」，高德解析为「${g.district}」`);
    if (localDistrict && !g.district)
      mismatches.push(`高德未能解析出区县，地址中的「${localDistrict}」可能不存在`);

    const houseBad = houseNotes.length > 0;
    let html = badge(precise && !mismatches.length && !houseBad ? 'pass' : (rough || mismatches.length || houseBad ? 'suspect' : 'pass'),
                     precise && !mismatches.length && !houseBad ? 'PASS · 地址有效' : 'SUSPECT · 地址存疑');
    html += `<div class="detail">
      <div class="kv"><b>匹配条数</b>${count} 条</div>
      <div class="kv"><b>匹配级别</b>${level}</div>
      <div class="kv"><b>格式化地址</b>${g.formatted_address}</div>
      <div class="kv"><b>省 / 市 / 区</b>${g.province || '—'} / ${g.city || '—'} / ${g.district || '—'}</div>
      <div class="kv"><b>乡镇/街道</b>${g.township || '—'}</div>
      <div class="kv"><b>坐标</b>${g.location}（GCJ-02）</div>
      <div class="kv"><b>adcode</b>${g.adcode}</div>`;

    // ---------- 门牌号合理性与比对 ----------
    const houseNotes = [];
    const hm = addr.match(/(\d{1,10})\s*号/);
    if (hm) {
      if (hm[1].length > 4)
        houseNotes.push(`门牌号「${hm[1]}号」位数异常（超过4位），真实门牌极少出现，疑似多写/误写`);
      const fmtHm = (g.formatted_address.match(/(\d{1,10})\s*号/) || [,''])[1];
      if (fmtHm && hm[1] !== fmtHm)
        houseNotes.push(`门牌号被高德纠正：原地址「${hm[1]}号」→ 实际匹配为「${fmtHm}号」，原门牌号很可能写错`);
    }

    if (mismatches.length) {
      html += `<div class="note err">⚠️ 交叉比对矛盾：<br>· ${mismatches.join('<br>· ')}<br>→ 原地址中的行政区划很可能写错（例如把海口的区写到了三亚）</div>`;
    }
    if (houseNotes.length) {
      html += `<div class="note warn">⚠️ 门牌号问题：<br>· ${houseNotes.join('<br>· ')}</div>`;
    }
    if (!mismatches.length && !houseNotes.length && precise) {
      html += `<div class="note ok">✔ 可定位到「${level}」级，地址真实可信</div>`;
    } else if (!mismatches.length && !houseNotes.length && rough) {
      html += `<div class="note warn">⚠ 只能粗定位到「${level}」级，说明路名/门牌/小区在高德库中不存在，建议人工核对</div>`;
    }
    if (count > 1) html += `<div class="note warn">ℹ 返回多条候选地址，可在“格式化地址”中确认是否第一条即期望位置</div>`;
    html += '</div>';
    setResult(html);
  } catch (e) {
    setResult(badge('suspect','SUSPECT · 网络错误') +
      `<div class="detail">${e.message}<div class="note warn">如果是跨域被拦截：请不要双击 file:// 打开，改用 <code>python -m http.server 8000</code> 后访问 http://localhost:8000/address_checker.html</div></div>`);
  } finally {
    btn.disabled = false; btn.textContent = '高德校验';
  }
}
</script>
</body>
</html>
